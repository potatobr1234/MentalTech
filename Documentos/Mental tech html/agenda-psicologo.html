<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda — Mental Tech</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <aside class="app-sidebar">
    <a href="index.html" class="sidebar-brand">
      <img src="assets/logo.svg" alt="Mental Tech" class="logo-mark">
      <span class="logo-text">Mental tech</span>
    </a>
    <ul class="sidebar-nav">
      <li><a href="painel-psicologo.html"><span class="ic">🏠</span> Dashboard</a></li>
      <li><a href="consultas.html"><span class="ic">📋</span> Consultas</a></li>
      <li><a href="agenda-psicologo.html" class="active"><span class="ic">🗓️</span> Agenda</a></li>
      <li><a href="pacientes.html"><span class="ic">👥</span> Pacientes</a></li>
      <li><a href="mensagens.html"><span class="ic">💬</span> Mensagens</a></li>
      <li><a href="disponibilidade.html"><span class="ic">🕒</span> Disponibilidade</a></li>
      <li><a href="meu-perfil-psicologo.html"><span class="ic">👤</span> Meu perfil</a></li>
      <li><a href="configuracoes-psicologo.html"><span class="ic">⚙️</span> Configurações</a></li>
    </ul>
    <a href="/api/auth/logout" class="sidebar-logout"><span class="ic">🚪</span> Sair</a>
  </aside>

  <div class="app-main">

    <header class="app-topbar">
      <div class="topbar-title">
        <h1>Agenda</h1>
        <p data-field="agenda-period">—</p>
      </div>
      <div class="app-actions">
        <button type="button" class="icon-btn" aria-label="Notificações">🔔<span class="dot"></span></button>
        <div class="user-chip">
          <span class="avatar-circle sm">🙂</span>
          <span class="user-meta">
            <span class="user-name" data-session-name>Minha conta</span>
            <span class="user-role" data-session-role>Psicóloga</span>
          </span>
        </div>
        <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="agendaMenu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>
    <div class="menu-panel" id="agendaMenu">
      <ul>
        <li><a href="meu-perfil-psicologo.html">Meu perfil</a></li>
        <li><a href="configuracoes-psicologo.html">Configurações</a></li>
        <li><a href="/api/auth/logout" class="logout">Sair</a></li>
      </ul>
    </div>

    <div class="app-content">

      <div class="agenda-toolbar">
        <div class="view-toggle">
          <button type="button" data-agenda-nav="prev">←</button>
          <button type="button" data-agenda-nav="next">→</button>
        </div>
      </div>

      <div class="calendar-table-wrap">
        <table class="calendar-table">
          <thead>
            <tr data-field="agenda-header">
              <th></th>
            </tr>
          </thead>
          <tbody data-field="agenda-body">
            <!-- preenchido via GET /api/consultas por js/psicologo.js -->
          </tbody>
        </table>
      </div>

      <p class="slot-note" data-field="agenda-empty">Nenhuma consulta agendada nesta semana.</p>

    </div>
  </div>
</div>

<script src="js/main.js" defer></script>
<script src="js/session.js" defer></script>
<script src="js/psicologo.js" defer></script>
</body>
</html>
