<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendamento confirmado — Mental Tech</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="navbar">
    <a href="index.html" class="brand">
      <img src="assets/logo.svg" alt="Mental Tech" class="logo-mark">
      <span class="logo-text">Mental <span>tech</span></span>
    </a>
    <div class="nav-actions app-actions">
      <button type="button" class="icon-btn" aria-label="Notificações">
        🔔<span class="dot"></span>
      </button>
      <div class="user-chip">
        <span class="avatar-circle sm">🙂</span>
        <span class="user-meta">
          <span class="user-name" data-session-name>Minha conta</span>
          <span class="user-role" data-session-role>—</span>
        </span>
      </div>
      <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="mainMenu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
  <div class="menu-panel" id="mainMenu">
    <ul>
      <li><a href="index.html">Início</a></li>
      <li><a href="conteudos.html">Conteúdos</a></li>
      <li><a href="psicologos.html">Psicólogos</a></li>
      <li><a href="dashboard.html" class="active">Meu painel</a></li>
      <li><a href="sobre.html">Sobre nós</a></li>
      <li><a href="mapa-do-site.html">Mapa do site</a></li>
      <li><a href="lgpd.html">LGPD</a></li>
      <li><a href="/api/auth/logout" class="logout">Sair</a></li>
    </ul>
  </div>
</header>

<!--
  TODO (backend): render this page from the confirmation returned by
  POST /api/consultas (professional name, date and time), or read a
  consultation id from the query string and GET /api/consultas/:id.
-->
<main class="confirm-page">
  <div class="confirm-card">
    <div class="confirm-icon">✅</div>
    <h1>Agendamento confirmado!</h1>
    <p>Você tem uma consulta marcada com <strong data-field="full_name">seu profissional</strong>.</p>

    <div class="confirm-box">
      <div class="confirm-date" data-field="data">—</div>
      <div class="confirm-time" data-field="horario">—</div>
    </div>

    <div class="actions">
      <!-- TODO (backend): link to the real conversation thread, e.g. /chat.html?psicologo=:id -->
      <a href="#" class="btn btn-primary">Abrir chat</a>
      <a href="psicologos.html" class="btn btn-secondary">Ver perfil</a>
    </div>
  </div>
</main>

<script src="js/main.js" defer></script>
<script src="js/session.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  if (!id) return;

  fetch('/api/consultas/' + id, { headers: { Accept: 'application/json' }, credentials: 'same-origin' })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (!data.ok) return;
      var c = data.consulta;
      var nameField = document.querySelector('[data-field="full_name"]');
      var dateField = document.querySelector('[data-field="data"]');
      var timeField = document.querySelector('[data-field="horario"]');
      if (nameField) nameField.textContent = c.professional_name;
      if (dateField) dateField.textContent = c.date.split('-').reverse().join('/');
      if (timeField) timeField.textContent = c.time;
    });
});
</script>
</body>
</html>
