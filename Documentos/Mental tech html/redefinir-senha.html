<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha — Mental Tech</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">

  <div class="auth-side">
    <img src="assets/logo.svg" alt="Mental Tech" class="logo-mark">
    <span class="logo-text">mental <span>tech</span></span>

    <div class="chat-mock small">
      <div class="bubble bubble-in">💬 Hoje quero conversar sobre ansiedade...</div>
      <div class="bubble bubble-out">Estou aqui. Pode começar! 🌱</div>
    </div>

    <p class="quote">"Cuidar da saúde mental é um ato de coragem e amor-próprio."</p>
  </div>

  <div class="auth-form-side">
    <div class="auth-form-wrap">
      <a href="selecionar-perfil.html" class="back-link">← Voltar</a>
      <h1>Criar nova senha</h1>
      <p>Escolha uma nova senha para a sua conta.</p>

      <div class="form-alert" data-form-alert></div>

      <form action="/api/auth/password/redefinir" method="POST" autocomplete="on" data-reset-form>
        <input type="hidden" name="token" value="" data-token-field>

        <div class="form-group">
          <label for="password">Nova senha</label>
          <input type="password" id="password" name="password" placeholder="••••••••" minlength="8" required>
        </div>

        <div class="form-group">
          <label for="password_confirm">Confirmar nova senha</label>
          <input type="password" id="password_confirm" name="password_confirm" placeholder="••••••••" minlength="8" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" data-submit-btn>Salvar nova senha</button>
      </form>
    </div>
  </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var alertBox = document.querySelector('[data-form-alert]');
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');

  var tokenField = document.querySelector('[data-token-field]');
  if (tokenField) tokenField.value = token || '';

  if (!token) {
    var form = document.querySelector('[data-reset-form]');
    if (form) form.style.display = 'none';
    if (alertBox) {
      alertBox.textContent = 'Link de redefinição inválido ou incompleto. Solicite um novo.';
      alertBox.classList.add('form-error', 'visible');
    }
    return;
  }

  var error = params.get('error');
  if (error && alertBox) {
    alertBox.textContent = error;
    alertBox.classList.add('form-error', 'visible');
  }

  var form = document.querySelector('[data-reset-form]');
  if (form) {
    form.addEventListener('submit', function (ev) {
      var password = form.password.value;
      var confirm = form.password_confirm.value;
      if (password.length < 8) {
        ev.preventDefault();
        if (alertBox) { alertBox.textContent = 'A senha deve ter no mínimo 8 caracteres.'; alertBox.classList.add('form-error', 'visible'); }
        return;
      }
      if (password !== confirm) {
        ev.preventDefault();
        if (alertBox) { alertBox.textContent = 'As senhas não coincidem.'; alertBox.classList.add('form-error', 'visible'); }
      }
    });
  }
});
</script>
</body>
</html>
