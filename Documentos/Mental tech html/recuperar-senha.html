<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar senha — Mental Tech</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">

  <div class="auth-side">
    <img src="assets/logo.svg" alt="Mental Tech" class="logo-mark">
    <span class="logo-text">mental <span>tech</span></span>

    <div class="chat-mock small">
      <div class="bubble bubble-in">💬 Hoje quero conversar sobre ansiedade...</div>
      <div class="bubble bubble-out">Estou aqui. Pode começar! 🌱</div>
    </div>

    <p class="quote">"Cuidar da saúde mental é um ato de coragem e amor-próprio."</p>
  </div>

  <div class="auth-form-side">
    <div class="auth-form-wrap">
      <a href="selecionar-perfil.html" class="back-link">← Voltar</a>
      <h1>Recuperar senha</h1>
      <p>Informe o e-mail da sua conta e enviaremos um link para você criar uma nova senha.</p>

      <div class="form-alert" data-form-alert></div>

      <form action="/api/auth/password/esqueci" method="POST" autocomplete="on" data-forgot-form>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Enviar link de recuperação</button>
      </form>

      <p class="form-footnote">Lembrou a senha? <a href="selecionar-perfil.html">Voltar para o login</a></p>
    </div>
  </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var alertBox = document.querySelector('[data-form-alert]');
  var params = new URLSearchParams(window.location.search);

  if (params.get('error') && alertBox) {
    alertBox.textContent = params.get('error');
    alertBox.classList.add('form-error', 'visible');
  } else if (params.get('sent') && alertBox) {
    alertBox.textContent = 'Se houver uma conta com esse e-mail, enviamos um link de recuperação. Confira sua caixa de entrada.';
    alertBox.classList.add('form-success', 'visible');

    // Esconde o formulário depois de enviar, pra deixar claro que o passo seguinte é checar o e-mail.
    var form = document.querySelector('[data-forgot-form]');
    if (form) form.style.display = 'none';

    // Conveniência SÓ para desenvolvimento/teste local: como este projeto
    // ainda não tem um servidor de e-mail configurado, o backend devolve o
    // link de redefinição aqui em vez de mandar por e-mail de verdade.
    // Isso nunca acontece em produção (NODE_ENV=production) — ver
    // server/routes/auth.js, rota POST /api/auth/password/esqueci.
    var devLink = params.get('dev_link');
    if (devLink) {
      var devBox = document.createElement('p');
      devBox.className = 'form-footnote';
      devBox.innerHTML = '🧪 Modo desenvolvimento (sem e-mail configurado): <a href="' + devLink + '">abrir link de redefinição</a>';
      alertBox.insertAdjacentElement('afterend', devBox);
    }
  }
});
</script>
</body>
</html>
